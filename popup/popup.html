<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <h1 class="logo">Job Tracker</h1>
        <span id="app-count" class="count-chip"></span>
      </div>
      <div class="toolbar-right">
        <button id="btn-add" class="btn-icon" title="Add manually">
          <svg viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H3a1 1 0 110-2h6V3a1 1 0 011-1z"/></svg>
        </button>
        <button id="btn-grab" class="btn-primary btn-sm" title="Grab from this tab">Grab Page</button>
        <a href="../options/options.html" target="_blank" class="btn-icon" title="Settings">
          <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
        </a>
      </div>
    </header>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
      <input id="search" type="search" placeholder="Search jobs…" autocomplete="off">
    </div>

    <div class="filters">
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="applied">Applied</option>
        <option value="oa">OA</option>
        <option value="interview">Interview</option>
        <option value="offer">Offer</option>
        <option value="rejected">Rejected</option>
        <option value="ghosted">Ghosted</option>
      </select>
      <select id="sort-by">
        <option value="appliedAt-desc">Newest first</option>
        <option value="appliedAt-asc">Oldest first</option>
        <option value="company-asc">Company A–Z</option>
      </select>
    </div>

    <main id="list-view">
      <div id="job-list"></div>
      <div id="empty-state" style="display:none" class="empty-state">
        <svg viewBox="0 0 64 64"><rect x="12" y="8" width="40" height="48" rx="4" fill="#e0e7ff"/><rect x="20" y="20" width="24" height="3" rx="1.5" fill="#818cf8"/><rect x="20" y="28" width="18" height="3" rx="1.5" fill="#c7d2fe"/><rect x="20" y="36" width="20" height="3" rx="1.5" fill="#c7d2fe"/></svg>
        <p>No applications yet.</p>
        <p class="hint">Click <strong>Grab Page</strong> on a job posting, or use <strong>+</strong> to add manually.</p>
      </div>
    </main>

    <!-- Slide-in form -->
    <div id="form-view" style="display:none" class="form-view">
      <div class="form-header">
        <button id="btn-back" class="btn-icon">
          <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
        </button>
        <h2 id="form-title">Add Application</h2>
      </div>
      <div class="form-body">
        <input type="hidden" id="f-id">
        <div class="field">
          <label for="f-title">Job Title *</label>
          <input id="f-title" type="text" placeholder="Software Engineer" required>
        </div>
        <div class="field">
          <label for="f-company">Company *</label>
          <input id="f-company" type="text" placeholder="Acme Corp" required>
        </div>
        <div class="field">
          <label for="f-location">Location</label>
          <input id="f-location" type="text" placeholder="Remote / NYC">
        </div>
        <div class="field row">
          <div>
            <label for="f-date">Applied Date</label>
            <input id="f-date" type="date">
          </div>
          <div>
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="applied">Applied</option>
              <option value="oa">OA</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
              <option value="ghosted">Ghosted</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-season">Term</label>
          <select id="f-season">
            <option value="">— select term —</option>
          </select>
        </div>
        <div class="field">
          <label for="f-desc">Job Description</label>
          <textarea id="f-desc" rows="6" placeholder="Paste the job description…"></textarea>
        </div>
        <div class="field">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" rows="3" placeholder="Recruiter name, referral, etc."></textarea>
        </div>
        <div id="f-dupe" class="dupe-warning" style="display:none">
          ⚠ This looks like a duplicate of an existing application.
        </div>
      </div>
      <div class="form-footer">
        <button id="btn-delete" class="btn-danger" style="display:none">Delete</button>
        <button id="btn-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
